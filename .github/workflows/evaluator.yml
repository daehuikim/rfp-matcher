name: evaluator

on:
  pull_request:
    paths: ["backend/**", "evaluator/**"]

jobs:
  rule-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        working-directory: backend
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Rule metrics
        working-directory: .
        run: python evaluator/runner.py

  llm-judge:
    if: contains(github.event.pull_request.labels.*.name, 'eval:llm')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        working-directory: backend
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: LLM judge
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python evaluator/runner.py --llm-judge
